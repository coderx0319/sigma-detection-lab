title: AWS Root Account Console Login
id: 6fb4f3f3-4f05-48ac-bbc2-c4779b700434
status: test
description: >
  Detects an interactive console sign-in by the AWS account root user.
  Root should be locked away after initial setup, so any interactive use
  warrants confirmation that it was planned and performed by a named
  person.
references:
  - https://attack.mitre.org/techniques/T1078/004/
author: Shantanu Vedante
date: 2026/11/26
tags:
  - attack.initial_access
  - attack.t1078.004
  - attack.privilege_escalation
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'ConsoleLogin'
    userIdentity.type: 'Root'
  condition: selection
falsepositives:
  - Planned break-glass access during an incident or billing change
level: high
