title: Windows Defender Exclusion Added via PowerShell
id: 0efc846f-4faa-4f69-9320-41939ab3a383
status: test
description: >
  Detects the addition of a Defender exclusion path or process. Attackers
  add exclusions before dropping tooling so that their payload directory is
  never scanned. Administrators do this legitimately, so correlate with who
  ran it and whether a change request exists.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Shantanu Vedante
date: 2026/11/26
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'Add-MpPreference'
      - 'Set-MpPreference'
  selection_exclusion:
    CommandLine|contains:
      - 'ExclusionPath'
      - 'ExclusionProcess'
      - 'ExclusionExtension'
      - 'DisableRealtimeMonitoring'
  condition: selection and selection_exclusion
falsepositives:
  - Administrators excluding known-noisy line-of-business applications
  - Antivirus migration scripts
level: high
