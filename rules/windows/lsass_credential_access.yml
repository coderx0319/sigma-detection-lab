title: LSASS Process Memory Access
id: cc6e06ae-3fe1-4576-a9a3-9c1c0f9c2439
status: test
description: >
  Detects a process opening a handle to lsass.exe with read permissions,
  the core behaviour behind credential dumping with tools such as Mimikatz
  or comsvcs.dll MiniDump. Very few legitimate processes need this access.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Shantanu Vedante
date: 2026/11/26
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_av:
    SourceImage|contains:
      - '\Windows Defender\'
      - '\MsMpEng.exe'
  condition: selection and not filter_av
falsepositives:
  - Endpoint protection and EDR agents reading process memory
  - Legitimate crash-dump and diagnostic utilities
level: critical
