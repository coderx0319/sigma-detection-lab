title: PowerShell Encoded Command Execution
id: 50338fba-8590-4f9c-921d-504f19c3a7f8
status: test
description: >
  Detects PowerShell launched with an encoded command block. Attackers use
  -EncodedCommand to hide payloads from command-line logging and basic
  string-matching defences. Legitimate use exists but is uncommon outside
  packaged software and management tooling.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Shantanu Vedante
date: 2026/11/26
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand'
      - ' -ec '
  filter_known_good:
    ParentImage|endswith: '\ccmexec.exe'
  condition: selection_image and selection_flag and not filter_known_good
falsepositives:
  - Software deployment tooling such as SCCM or Intune wrapping scripts
  - Some vendor installers and backup agents
level: high
