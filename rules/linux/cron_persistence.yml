title: Crontab Modified From a Suspicious Path
id: eb15c809-3fc2-4343-92f0-294c0962a49d
status: test
description: >
  Detects writes to cron directories or crontab invocations that reference
  world-writable paths. Cron remains one of the simplest and most durable
  persistence mechanisms on Linux hosts.
references:
  - https://attack.mitre.org/techniques/T1053/003/
author: Shantanu Vedante
date: 2026/11/26
tags:
  - attack.persistence
  - attack.t1053.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_path:
    CommandLine|contains:
      - '/etc/cron.d/'
      - '/etc/crontab'
      - '/var/spool/cron/'
  selection_suspicious:
    CommandLine|contains:
      - '/tmp/'
      - '/dev/shm/'
      - '/var/tmp/'
      - 'curl '
      - 'wget '
  condition: selection_path and selection_suspicious
falsepositives:
  - Configuration management writing cron entries that fetch artefacts
level: high
